<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="樣品倉">
<title>樣品倉借用管理</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#e2e0d8;--ac:#1f6f5c;--acx:#fff;--out:#b4531a;--back:#1f6f5c;--gift:#7a3fb0;--oth:#6b6b66}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#161615;--card:#212120;--tx:#efeee8;--mu:#a0a09a;--bd:#34332f;--ac:#4fb89d;--acx:#0d1f1a;--out:#e88b50;--back:#4fb89d;--gift:#c19af0;--oth:#a0a09a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.big{width:100%;margin-top:14px;padding:14px;font-size:17px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:12px 4px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.seg button.on{color:var(--acx);border-color:transparent}
.seg button[data-a="借出"].on{background:var(--out)}
.seg button[data-a="歸還"].on{background:var(--back)}
.seg button[data-a="贈出"].on{background:var(--gift)}
.seg button[data-a="其他"].on{background:var(--oth)}
#reader{margin-top:10px;border-radius:10px;overflow:hidden}
.it{margin-bottom:8px}
.it .st{font-size:13px;color:var(--mu);margin:3px 2px 0;word-break:break-all}
.it .st.w{color:var(--out)}
.x{padding:0 14px}
.bc{min-width:0}
.rl{width:92px;flex:none;display:none}
.ret .rl{display:block}
input[type=checkbox]{width:20px;height:20px;padding:0;flex:none;accent-color:var(--ac)}
.gp{border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden}
.gp summary{padding:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.osum{display:flex;align-items:center}
.osum::after,.gp summary::after{content:'▾';margin-left:auto;padding-left:8px;color:var(--mu);transition:transform .2s}
details[open]>summary::after{transform:rotate(180deg)}
label.oi{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-top:1px solid var(--bd);margin:0;font-size:14px;color:var(--tx);cursor:pointer}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid currentColor}
.b-out{color:var(--out)}.b-back{color:var(--back)}.b-gift{color:var(--gift)}.b-oth{color:var(--oth)}
.sum{margin-top:12px;font-size:14px;color:var(--mu)}
.log{border-bottom:1px solid var(--bd);padding:10px 0}
.log:last-child{border-bottom:0}
.t{font-size:12px;color:var(--mu)}.c{font-weight:700;word-break:break-all}.m{font-size:14px;color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;white-space:pre-line}
#toast.show{opacity:1}
.warn{border:1px solid var(--out);color:var(--out);padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>樣品倉借用管理</h1>
<div id="dbwarn" class="warn" hidden>無法讀取試算表資料，請檢查網路或重新整理。</div>
<div class="tabs"><button id="t1" class="on">登記</button><button id="t2">紀錄（<span id="cnt">0</span>）</button><button id="t3">刷碼</button></div>

<section id="p1">
  <div class="card">
    <label>動作</label>
    <div class="seg" id="act">
      <button data-a="借出" class="on" type="button">借出</button>
      <button data-a="歸還" type="button">歸還</button>
      <button data-a="贈出" type="button">贈出</button>
      <button data-a="其他" type="button">其他</button>
    </div>
    <label for="who" id="lblWho">借用人</label><input id="who" placeholder="姓名" autocomplete="off">
    <label for="purpose">活動用途</label><select id="purpose"><option value="">請選擇活動用途</option></select><div id="purHint" class="t" style="margin-top:4px"></div>
    <div id="fStatus" hidden><label for="status">商品狀態</label><select id="status"></select></div>
    <div id="fLoc" hidden><label for="loc">樣品倉庫位置</label><select id="loc"></select><div id="locHint" class="t" style="margin-top:4px"></div></div>
    <div class="sum" id="sum"></div>
  </div>
  <details class="card" id="outCard" open hidden>
    <summary class="osum"><span><b>借出中的商品</b> <span class="t" id="outCnt"></span></span></summary>
    <div class="top" style="margin:10px 0 8px"><div class="t">依大總表的使用原因分組，勾選要歸還的品項，會自動加入下方的商品條碼清單</div><button class="btn ghost" id="outRefresh" type="button">重新整理</button></div>
    <input id="outQ" placeholder="搜尋品名 / 條碼 / 借用人">
    <div id="outList" style="margin-top:8px"></div>
  </details>
  <div class="card">
    <div class="top"><label style="margin:0">商品條碼</label><span class="t" id="itemCnt"></span></div>
    <div class="t" style="margin:2px 0 8px">掃描或輸入後按 Enter，會自動換到下一列新商品；最後一列留空再按 Enter 即跳到上方的姓名欄位</div>
    <div id="items"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="addRow" type="button">＋ 新增一列</button>
      <button class="btn" id="scanBtn" type="button">掃描</button>
      <button class="btn ghost" id="picBtn" type="button">照片</button>
    </div>
    <input type="file" id="pic" accept="image/*" capture="environment" hidden>
    <div id="reader" hidden></div>
    <div id="scanInfo" class="t" style="margin-top:6px"></div>
    <div id="tmp" hidden></div>
  </div>
  <button class="btn big" id="submit" type="button" style="margin-bottom:24px">送出登記</button>
</section>

<section id="p2" hidden>
  <div class="card">
    <div class="top"><input id="q" placeholder="搜尋條碼 / 姓名 / 用途"><a id="sheet" class="btn ghost" target="_blank" rel="noopener" href="#">開啟試算表</a></div>
    <div id="list" style="margin-top:8px"></div>
  </div>
</section>

<section id="p3" hidden>
  <div class="card">
    <div class="top"><b>刷碼紀錄</b><span class="t" id="scCnt"></span></div>
    <div class="t" style="margin:2px 0 8px">只記錄條碼與時間，不會更改大總表的任何資料。掃描或輸入條碼後按 Enter，就會自動記錄。</div>
    <input id="scCode" placeholder="掃描或輸入條碼，按 Enter 記錄" autocomplete="off" autocapitalize="off" enterkeyhint="done">
    <div class="row" style="margin-top:10px">
      <button class="btn" id="scScan" type="button">掃描</button>
      <button class="btn ghost" id="scPic" type="button">照片</button>
    </div>
    <input type="file" id="scFile" accept="image/*" capture="environment" hidden>
    <div id="scReader" hidden style="margin-top:10px;border-radius:10px;overflow:hidden"></div>
    <div id="scInfo" class="t" style="margin-top:6px"></div>
    <div id="scTmp" hidden></div>
    <div id="scList" style="margin-top:12px"></div>
  </div>
</section>
</main>
<div id="toast"></div>

<script>document.write('<script src="config.js?_='+Date.now()+'"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const OTHER=['福利品','無此商品','無法復原瑕疵商品','現場售出','小舞台拍賣'];
const OTH_LOC=['無','17F','10F','無此商品'];
const RET_LOC=['17F','10F'];
const AUTO={'無此商品':'無此商品','現場售出':'無','小舞台拍賣':'無'};
const LABEL={'借出':'借用人','歸還':'歸還人','贈出':'領取人','其他':'經手人'};
const WHN={'17F':'17樓','10F':'中正10樓'};
const $=id=>document.getElementById(id);
/* 設定（API_URL、SCAN_PREFIXES）放在同資料夾的 config.js，之後更新 index.html 不需要再改設定 */
function prefixTip(){const P=typeof SCAN_PREFIXES!=='undefined'?SCAN_PREFIXES:[];return '（目前設定只接受開頭：'+P.join('、')+'；要取消限制，請把 config.js 的 SCAN_PREFIXES 改成 []）'}
function okPrefix(t){const P=typeof SCAN_PREFIXES!=='undefined'?SCAN_PREFIXES:[];return !P.length||P.some(p=>String(t).startsWith(p))}
function getToken(){
  let t='';
  try{t=localStorage.getItem('wh_token')||''}catch(e){}
  if(!t){t=(prompt('請輸入系統密碼')||'').trim();if(t){try{localStorage.setItem('wh_token',t)}catch(e){}}}
  return t;
}
async function run(fn,...a){
  if(typeof API_URL==='undefined'||!/^https:\/\/script\.google\.com\//.test(API_URL))throw new Error('尚未設定 API_URL（請確認 config.js 已上傳並填入網址）');
  const body={token:getToken(),action:fn};
  if(fn==='lookup')body.codes=a[0];else if(fn==='addLogs'||fn==='addScans')body.list=a[0];
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!j.ok){
    if(j.error==='AUTH'){try{localStorage.removeItem('wh_token')}catch(e){}throw new Error('密碼錯誤，請重新整理後再輸入')}
    throw new Error(j.error||'伺服器錯誤');
  }
  return j.data;
}
let logs=[],scanner=null,act='借出',lastScan='',lastAt=0;
const INFO={},pending=new Set();
let OUT=null,GROUPS=[],outFilter='';
const itemsEl=$('items');

$('status').innerHTML=OTHER.map(s=>`<option>${s}</option>`).join('');

function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),ms||2400)}
function fmt(ts){return new Date(ts).toLocaleString('zh-TW',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cls(j){return j==='借出'?'b-out':j==='歸還'?'b-back':j==='贈出'?'b-gift':'b-oth'}

/* ---------- 商品列 ---------- */
const rows=()=>[...itemsEl.querySelectorAll('.it')];
const codes=()=>rows().map(d=>d.querySelector('.bc').value.trim()).filter(Boolean);
const isOut=i=>!!(i&&i.found&&(i.where==='借出中'||i.status==='借用'));
function prevWh(c){for(const l of logs){if(l.code!==c)continue;if(l.orig)return l.orig;if(l.loc==='17F'||l.loc==='10F')return l.loc}return ''}
function knownWh(c){
  const i=INFO[c];
  if(i&&i.found&&i.where&&i.where!=='借出中'){if(i.where.indexOf('17')>=0)return '17F';if(i.where.indexOf('10')>=0)return '10F'}
  return prevWh(c);
}
function setRowLoc(d){
  if(d.dataset.manual)return;
  const c=d.querySelector('.bc').value.trim();
  d.querySelector('.rl').value=c?'10F':'';  // 歸還一律預設回到中正10樓
}
const setAllLoc=()=>rows().forEach(setRowLoc);
function updateCnt(){const n=codes().length;$('itemCnt').textContent=n?'共 '+n+' 件':'';syncChecks()}

function paint(d){
  const c=d.querySelector('.bc').value.trim(),e=d.querySelector('.st');
  e.className='st';
  if(!c){e.textContent='';return}
  const i=INFO[c];
  if(!i){e.textContent='查詢大總表中…';return}
  if(i.err){e.textContent='大總表讀取失敗：'+i.err;e.classList.add('w');return}
  if(!i.found){e.textContent='⚠ 大總表查無此條碼（仍可登記，只會記在異動紀錄）';e.classList.add('w');return}
  let s=(i.name||'（無品名）')+'｜所在地：'+(i.where||'—')+'｜狀態：'+(i.status||'—');
  if(i.who)s+='｜'+i.who;
  if(i.purpose)s+=' · '+i.purpose;
  if(i.period)s+=' · '+i.period;
  let w='';
  if(act==='借出'&&isOut(i))w='⚠ 已是借出中';
  else if(act==='歸還'&&!isOut(i))w='⚠ 目前不在借出中';
  e.textContent=s+(w?'　'+w:'');
  if(w||isOut(i))e.classList.add('w');
}
const paintAll=()=>rows().forEach(paint);

async function fetchInfo(list){
  const need=[...new Set(list)].filter(c=>c&&!pending.has(c)&&(!INFO[c]||INFO[c].err));
  if(!need.length)return;
  need.forEach(c=>pending.add(c));
  try{Object.assign(INFO,await run('lookup',need))}
  catch(e){need.forEach(c=>{INFO[c]={err:(e&&e.message)||'連線失敗'}})}
  need.forEach(c=>pending.delete(c));
  paintAll();setAllLoc();
  if(act==='歸還'&&!$('who').value){
    const f=codes().map(c=>INFO[c]).find(i=>i&&isOut(i)&&i.who);
    if(f)$('who').value=f.who;
  }
  updateLocHint();
}

function commit(d){
  const inp=d.querySelector('.bc'),c=inp.value.trim();
  if(!c)return false;
  if(!okPrefix(c)){toast('已略過：'+c+'（開頭不符）'+prefixTip());inp.value='';paint(d);updateCnt();return false}
  if(rows().some(x=>x!==d&&x.querySelector('.bc').value.trim()===c)){toast('此條碼已在清單中');inp.value='';paint(d);updateCnt();return false}
  delete INFO[c];d.dataset.manual='';paint(d);setRowLoc(d);updateCnt();fetchInfo([c]);
  return true;
}

function addRow(code,focus){
  const d=document.createElement('div');
  d.className='it';
  d.innerHTML='<div class="row"><input class="bc" placeholder="條碼" autocomplete="off" autocapitalize="off" enterkeyhint="next"><select class="rl" aria-label="歸還位置"><option value="">位置</option><option>17F</option><option>10F</option></select><button class="btn ghost x" type="button" aria-label="移除">✕</button></div><div class="st"></div>';
  const inp=d.querySelector('.bc');
  d.querySelector('.rl').onchange=()=>{d.dataset.manual='1'};
  inp.value=code||'';
  inp.onkeydown=e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    if(!inp.value.trim()){if(d===rows().pop())$('who').focus();return}
    commit(d);
    const nx=d.nextElementSibling;
    if(nx)nx.querySelector('.bc').focus();else addRow('',true);
  };
  inp.onblur=()=>{const c=inp.value.trim();if(c&&!INFO[c]&&!pending.has(c))commit(d)};
  inp.oninput=updateCnt;
  inp.onpaste=e=>{
    const t=(e.clipboardData||window.clipboardData).getData('text');
    const parts=t.split(/[\s,;，；]+/).filter(Boolean);
    if(parts.length<2)return;
    e.preventDefault();
    const have=new Set(codes());
    const add=parts.filter(okPrefix).filter((p,i)=>i===0||!have.has(p));
    if(!add.length){toast('貼上的內容都不是商品條碼');return}
    inp.value=add[0];
    add.slice(1).forEach(p=>{if(!codes().includes(p))addRow(p,false)});
    rows().forEach(x=>{const c=x.querySelector('.bc').value.trim();if(c)delete INFO[c]});
    paintAll();setAllLoc();updateCnt();fetchInfo(add);
    if(rows().pop().querySelector('.bc').value.trim())addRow('',true);
  };
  d.querySelector('.x').onclick=()=>{d.remove();if(!rows().length)addRow('',false);updateCnt();updateLocHint()};
  itemsEl.appendChild(d);
  if(focus)inp.focus();
  return d;
}
$('addRow').onclick=()=>{const l=rows().pop();if(l&&!l.querySelector('.bc').value.trim())l.querySelector('.bc').focus();else addRow('',true)};

/* 掃描／照片取得的條碼加入清單（不重複） */
function pushCode(c){
  c=String(c).trim();
  if(!c||!okPrefix(c)||codes().includes(c))return false;
  let d=rows().pop();
  if(d.querySelector('.bc').value.trim())d=addRow('',false);
  d.querySelector('.bc').value=c;
  delete INFO[c];d.dataset.manual='';paint(d);setRowLoc(d);updateCnt();fetchInfo([c]);
  addRow('',false);
  return true;
}

/* ---------- 動作與欄位 ---------- */
function fillLoc(){
  if(act!=='其他')return;
  const opts=OTH_LOC;
  $('loc').innerHTML='<option value="@auto">各商品原位置（自動）</option>'+opts.map(s=>`<option>${s}</option>`).join('');
  $('loc').value=act==='其他'&&AUTO[$('status').value]?AUTO[$('status').value]:'@auto';
  updateLocHint();
}
function updateLocHint(){
  const h=$('locHint');
  if(act==='其他'&&$('loc').value==='@auto'){
    const cs=codes(),miss=cs.filter(c=>!knownWh(c));
    h.textContent=!cs.length?'':miss.length?`${cs.length-miss.length} 件已知原位置；${miss.length} 件找不到，請改手動選擇位置`:`${cs.length} 件都已找到原位置（${[...new Set(cs.map(c=>WHN[knownWh(c)]))].join('、')}）`;
  }else h.textContent='';
  showSum();
}
function values(){
  const status=act==='借出'?'借用中':act==='歸還'?'歸還':act==='贈出'?'贈出':$('status').value;
  const loc=act==='借出'?'借出中':act==='贈出'?'無':act==='歸還'?'':$('loc').value;
  return {status,loc};
}
function showSum(){
  const v=values();
  $('sum').innerHTML=`<span class="badge ${cls(act)}">${act}</span> 狀態：${esc(v.status)}${act==='歸還'?'':'　位置：'+(v.loc==='@auto'?'各商品原位置':esc(v.loc))}`;
}
function setAct(a){
  act=a;
  document.querySelectorAll('#act button').forEach(b=>b.classList.toggle('on',b.dataset.a===a));
  $('lblWho').textContent=LABEL[a];
  $('fStatus').hidden=a!=='其他';
  $('fLoc').hidden=a!=='其他';
  itemsEl.classList.toggle('ret',a==='歸還');
  $('outCard').hidden=a!=='歸還';
  if(a==='歸還'&&OUT===null)loadOut();
  fillLoc();showSum();paintAll();setAllLoc();
}
document.querySelectorAll('#act button').forEach(b=>b.onclick=()=>setAct(b.dataset.a));
$('status').onchange=()=>{fillLoc();showSum()};
$('loc').onchange=updateLocHint;

/* ---------- 相機 ---------- */
/* 防止一次刷出兩個條碼：
   1) 需在短時間內連續讀到兩次相同結果才採用（過濾偶發的讀錯）
   2) 同一條碼 4 秒內不重複
   3) 採用一筆後 1.5 秒內忽略其他條碼（例如同張標籤上的第二個條碼） */
/* 標準零售條碼（EAN-13 / UPC-A）檢查碼正確者可信度高，讀到一次就採用 */
function checkOk(t){
  if(!/^\d{12,13}$/.test(t))return false;
  const d=t.split('').map(Number),chk=d.pop();
  let s=0;
  for(let i=d.length-1,w=3;i>=0;i--,w=w===3?1:3)s+=d[i]*w;
  return (10-s%10)%10===chk;
}
function makeGate(info){
  info=info||function(){};
  const reads=[];let lastCode='',lastAt=-1e12,lastAny=-1e12;
  return function(t){
    t=String(t).trim();
    const n=Date.now();
    if(!t)return false;
    if(!okPrefix(t)){info('讀到 '+t+'：開頭不符，已略過'+prefixTip());return false}
    if(t===lastCode&&n-lastAt<4000){lastAt=n;return false}
    if(n-lastAny<1500)return false;
    if(!checkOk(t)){
      reads.push({t,at:n});
      while(reads.length&&n-reads[0].at>1200)reads.shift();
      if(reads.filter(r=>r.t===t).length<2){info('讀到 '+t+'，請保持穩定以確認…');return false}
    }
    reads.length=0;lastCode=t;lastAt=n;lastAny=n;
    info('已加入 '+t);
    return true;
  };
}
/* 啟動相機：優先要求高解析度，失敗再退回一般設定；並嘗試開啟連續對焦 */
async function startCam(sc,onRead){
  const box={fps:10,qrbox:(w,h)=>({width:Math.floor(w*0.9),height:Math.floor(Math.min(w,h)*0.5)})};
  try{
    await sc.start({facingMode:'environment'},Object.assign({videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}},box),onRead,()=>{});
  }catch(e){
    const n=(e&&e.name)||'',msg=String((e&&e.message)||e||'');
    if(n==='NotAllowedError'||/permission|denied|not allowed/i.test(msg))throw e;
    await sc.start({facingMode:'environment'},box,onRead,()=>{});
  }
  try{await sc.applyVideoConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
}
async function startScan(){
  if(!window.Html5Qrcode){toast('掃描元件載入失敗，請手動輸入');return}
  $('reader').hidden=false;$('scanBtn').textContent='關閉';
  const F=window.Html5QrcodeSupportedFormats;
  const cfg={verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
  if(F)cfg.formatsToSupport=[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.QR_CODE];
  const gate=makeGate(m=>{$('scanInfo').textContent=m});
  $('scanInfo').textContent='請把條碼放大到填滿框的一半以上寬度，保持穩定、避免反光';
  scanner=new Html5Qrcode('reader',cfg);
  try{
    await startCam(scanner,t=>{
      if(!gate(t))return;
      t=t.trim();
      if(pushCode(t)){navigator.vibrate&&navigator.vibrate(60);toast('已加入：'+t,1200)}
    });
  }catch(e){
    const n=(e&&e.name)||'',msg=String((e&&e.message)||e||'');
    const blocked=n==='NotAllowedError'||/permission|denied|not allowed/i.test(msg);
    toast((blocked?'相機被封鎖了：請允許相機權限；若仍不行，可能是此頁面環境不允許即時相機':'無法開啟即時相機：'+(n||msg))+'\n請改按「照片」',6000);
    stopScan();
  }
}
async function stopScan(){
  try{if(scanner){await scanner.stop();scanner.clear()}}catch(e){}
  scanner=null;$('reader').hidden=true;$('scanInfo').textContent='';$('scanBtn').textContent='掃描';
}
$('scanBtn').onclick=()=>scanner?stopScan():startScan();
$('picBtn').onclick=()=>$('pic').click();
$('pic').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!window.Html5Qrcode)return;
  try{
    const h=new Html5Qrcode('tmp');
    const t=await h.scanFile(f,false);
    const c=String(t).trim();
    toast(!okPrefix(c)?'讀到的是 '+c+'，開頭不符，已略過'+prefixTip():pushCode(c)?'已加入：'+c:'此條碼已在清單中',3500);
  }catch(err){toast('讀不到條碼，請拍近一點、對焦後再試')}
};

/* ---------- 送出 ---------- */
$('submit').onclick=async()=>{
  const cs=[...new Set(codes())];
  if(!cs.length){toast('請先掃描或輸入條碼');return}
  const who=$('who').value.trim();
  if(!who){toast('請填寫'+LABEL[act]);$('who').focus();return}
  const v=values(),purpose=$('purpose').value.trim(),unknown=[];
  const rl={};rows().forEach(d=>{const c=d.querySelector('.bc').value.trim();if(c)rl[c]=d.querySelector('.rl').value});
  const recs=cs.map(code=>{
    let loc=v.loc;
    if(act==='歸還'){loc=rl[code]||'';if(!loc)unknown.push(code)}
    else if(loc==='@auto'){loc=knownWh(code);if(!loc)unknown.push(code)}
    return {action:act,code,who,purpose,status:v.status,loc};
  });
  if(unknown.length){toast((act==='歸還'?'請為這些商品選擇歸還位置：':'這些商品找不到原位置，請改手動選擇倉庫位置：')+'\n'+unknown.slice(0,5).join('、')+(unknown.length>5?'…':''),5000);return}
  $('submit').disabled=true;$('submit').textContent='儲存中…（'+recs.length+' 件）';
  try{
    const res=await run('addLogs',recs);
    const ok=res.filter(r=>r.ok),fail=res.filter(r=>!r.ok);
    const upd=ok.filter(r=>r.matched>0).length,nf=ok.filter(r=>r.matched===0).length,bad=ok.filter(r=>r.matched<0);
    let m='已登記 '+ok.length+' 件（'+act+'）';
    if(upd){const by={};ok.forEach(r=>{for(const k in (r.by||{}))if(r.by[k]>0)by[k]=(by[k]||0)+1});m+='\n'+Object.keys(by).map(k=>k+'已更新 '+by[k]+' 件').join('；')}
    if(nf)m+='\n大總表查無條碼 '+nf+' 件（只記在異動紀錄）';
    if(bad.length)m+='\n大總表無法更新：'+(bad[0].note||'');
    if(fail.length)m+='\n失敗 '+fail.length+' 件：'+fail.slice(0,3).map(r=>r.code+'（'+r.error+'）').join('、');
    toast(m,fail.length||nf||bad.length?7000:3000);
    const okSet=new Set(ok.map(r=>r.code));
    rows().forEach(d=>{const c=d.querySelector('.bc').value.trim();if(okSet.has(c)){delete INFO[c];d.remove()}});
    if(!rows().length)addRow('',false);
    else if(rows().pop().querySelector('.bc').value.trim())addRow('',false);
    updateCnt();paintAll();
    if(act==='歸還')loadOut();else OUT=null;
    await load();
    rows()[0].querySelector('.bc').focus();
  }catch(e){toast('儲存失敗：'+(e&&e.message?e.message:'請稍後再試'),4000)}
  $('submit').disabled=false;$('submit').textContent='送出登記';
};

/* ---------- 紀錄 ---------- */
function renderList(){
  const q=$('q').value.trim().toLowerCase();
  const list=logs.filter(l=>!q||[l.code,l.name,l.who,l.purpose,l.status,l.loc,l.judge].join(' ').toLowerCase().includes(q)).slice(0,150);
  $('list').innerHTML=list.length?list.map(l=>`<div class="log"><div class="t">${fmt(l.ts)}</div><div class="top"><span class="c">${esc(l.code)}</span><span class="badge ${cls(l.judge)}">${esc(l.judge)}</span></div>${l.name?'<div class="m" style="color:var(--tx)">'+esc(l.name)+'</div>':''}<div class="m">${esc(l.status)} ／ ${esc(l.loc)}<br>${esc(l.who)}${l.purpose?' · '+esc(l.purpose):''}</div></div>`).join(''):'<div class="m">沒有紀錄</div>';
  $('cnt').textContent=logs.length;
}
$('q').oninput=renderList;
/* ---------- 歸還：從借出中清單勾選 ---------- */
function outBadge(){
  const e=$('outCnt');
  if(!OUT){e.textContent='載入中…';return}
  if(OUT.err){e.textContent='讀取失敗';return}
  const have=new Set(codes()),k=OUT.items.filter(i=>have.has(i.code)).length;
  e.textContent='共 '+OUT.items.length+' 件'+(k?'，已選 '+k:'');
}
function placeCode(c,info){
  let d=rows().pop();
  if(!d||d.querySelector('.bc').value.trim())d=addRow('',false);
  d.querySelector('.bc').value=c;d.dataset.manual='';
  if(info)INFO[c]=info;
  paint(d);
}
function addOut(cs){
  const have=new Set(codes()),by=new Map(OUT.items.map(i=>[i.code,i]));
  cs.forEach(c=>{if(!have.has(c)){placeCode(c,by.get(c));have.add(c)}});
  if(rows().pop().querySelector('.bc').value.trim())addRow('',false);
  if(!$('who').value){const f=cs.map(c=>by.get(c)).find(i=>i&&i.who);if(f)$('who').value=f.who}
  updateCnt();setAllLoc();updateLocHint();
}
function dropCodes(cs){
  const s=new Set(cs);
  rows().forEach(d=>{if(s.has(d.querySelector('.bc').value.trim()))d.remove()});
  if(!rows().length)addRow('',false);
  else if(rows().pop().querySelector('.bc').value.trim())addRow('',false);
  updateCnt();updateLocHint();
}
function syncChecks(){
  if(act!=='歸還'||!OUT||OUT.err)return;
  const have=new Set(codes()),box=$('outList');outBadge();
  box.querySelectorAll('input[data-code]').forEach(cb=>{cb.checked=have.has(cb.dataset.code)});
  box.querySelectorAll('input[data-g]').forEach(cb=>{
    const G=GROUPS[+cb.dataset.g];if(!G)return;
    const n=G.v.filter(i=>have.has(i.code)).length;
    cb.checked=n===G.v.length;cb.indeterminate=n>0&&n<G.v.length;
    cb.closest('summary').querySelector('.sel').textContent=n?'，已選 '+n:'';
  });
}
function renderOut(){
  const box=$('outList');outBadge();
  if(OUT===null){box.textContent='載入中…';return}
  if(OUT.err){box.textContent='讀取失敗：'+OUT.err;return}
  const q=outFilter.trim().toLowerCase();
  const items=OUT.items.filter(i=>!q||[i.code,i.name,i.who,i.purpose,i.period].join(' ').toLowerCase().includes(q));
  if(!items.length){box.textContent=OUT.items.length?'沒有符合的商品':'目前大總表沒有借出中的商品';GROUPS=[];return}
  const g=new Map();
  items.forEach(i=>{const k=i.purpose||'（未填使用原因）';if(!g.has(k))g.set(k,[]);g.get(k).push(i)});
  GROUPS=[...g].map(([k,v])=>({k,v}));
  const open=q||GROUPS.length<=2?' open':'';
  box.innerHTML=GROUPS.map((G,gi)=>`<details class="gp"${open}><summary><input type="checkbox" data-g="${gi}"><span><b>${esc(G.k)}</b> <span class="t">${G.v.length} 件<span class="sel"></span></span></span></summary>`
    +G.v.map(i=>`<label class="oi"><input type="checkbox" data-code="${esc(i.code)}"><span>${esc(i.name||'（無品名）')}<br><span class="t">${esc(i.code)}${i.who?' · '+esc(i.who):''}${i.period?' · '+esc(i.period):''}</span></span></label>`).join('')
    +'</details>').join('');
  syncChecks();
}
async function loadOut(){
  OUT=null;renderOut();
  try{OUT={items:await run('getOut')}}catch(e){OUT={err:(e&&e.message)||'連線失敗',items:[]}}
  renderOut();
}
$('outList').addEventListener('click',e=>{if(e.target.matches('summary input'))e.stopPropagation()});
$('outList').addEventListener('change',e=>{
  const t=e.target;
  if(!OUT||OUT.err)return;
  if(t.dataset.code!==undefined)t.checked?addOut([t.dataset.code]):dropCodes([t.dataset.code]);
  else if(t.dataset.g!==undefined){const cs=GROUPS[+t.dataset.g].v.map(i=>i.code);t.checked?addOut(cs):dropCodes(cs)}
});
$('outRefresh').onclick=loadOut;
$('outQ').oninput=()=>{outFilter=$('outQ').value;renderOut()};

function fillPurposes(list){
  const el=$('purpose'),key=JSON.stringify(list);
  if(el.dataset.key===key)return;
  const cur=el.value;
  el.dataset.key=key;
  el.innerHTML='<option value="">請選擇活動用途</option>'+list.map(p=>`<option>${esc(p)}</option>`).join('');
  el.value=list.includes(cur)?cur:'';
  $('purHint').textContent=list.length?'':'「活動用途」分頁沒有選項，請在該分頁新增';
}
/* ---------- 刷碼：只記錄條碼與時間，不改動大總表 ---------- */
const SC=[];let scSeq=0,scBusy=false,sc2=null,sc2Last='',sc2At=0;
function renderSc(){
  const ok=SC.filter(i=>i.state==='ok').length;
  $('scCnt').textContent=SC.length?`本次 ${SC.length} 筆，已記錄 ${ok}`:'';
  $('scList').innerHTML=SC.map(i=>{
    const t=new Date(i.ts).toLocaleTimeString('zh-TW',{hour12:false});
    const st=i.state==='ok'?'<span class="badge b-back">已記錄</span>':i.state==='fail'?`<button class="btn ghost" data-retry="${i.id}" type="button">重試</button>`:'<span class="badge b-oth">傳送中…</span>';
    const sub=i.state==='fail'?'<span style="color:var(--out)">失敗：'+esc(i.err)+'</span>':i.state==='ok'?(i.found?esc(i.name||'（無品名）'):'<span style="color:var(--out)">⚠ 大總表查無此條碼（仍已記錄）</span>'):'';
    return `<div class="log"><div class="t">${t}</div><div class="top"><span class="c">${esc(i.code)}</span>${st}</div><div class="m">${sub}</div></div>`;
  }).join('');
}
async function scFlush(){
  if(scBusy)return;scBusy=true;
  try{
    for(;;){
      const batch=SC.filter(i=>i.state==='queued').reverse().slice(0,50);
      if(!batch.length)break;
      batch.forEach(i=>{i.state='sending'});renderSc();
      try{
        const res=await run('addScans',batch.map(i=>({code:i.code,ts:i.ts})));
        batch.forEach((i,k)=>{const r=res[k]||{};if(r.ok){i.state='ok';i.name=r.name||'';i.found=!!r.found}else{i.state='fail';i.err=r.error||'未知錯誤'}});
      }catch(e){batch.forEach(i=>{i.state='fail';i.err=(e&&e.message)||'連線失敗'})}
      renderSc();
    }
  }finally{scBusy=false}
}
function scRecord(code){
  code=String(code).trim();
  if(!code)return;
  if(!okPrefix(code)){toast('已略過：'+code+'（開頭不符）'+prefixTip());return}
  SC.unshift({id:++scSeq,code,ts:Date.now(),state:'queued',name:'',found:false,err:''});
  if(SC.length>300)SC.length=300;
  renderSc();scFlush();
}
$('scCode').onkeydown=e=>{
  if(e.key!=='Enter')return;
  e.preventDefault();
  const c=$('scCode').value.trim();
  if(!c)return;
  $('scCode').value='';scRecord(c);
};
$('scCode').onpaste=e=>{
  const t=(e.clipboardData||window.clipboardData).getData('text');
  const parts=t.split(/[\s,;，；]+/).filter(Boolean);
  if(parts.length<2)return;
  e.preventDefault();parts.forEach(scRecord);
};
$('scList').addEventListener('click',e=>{
  const b=e.target.closest('[data-retry]');
  if(!b)return;
  const it=SC.find(x=>x.id===+b.dataset.retry);
  if(it){it.state='queued';renderSc();scFlush()}
});
async function startScan2(){
  if(!window.Html5Qrcode){toast('掃描元件載入失敗，請手動輸入');return}
  $('scReader').hidden=false;$('scScan').textContent='關閉';
  const F=window.Html5QrcodeSupportedFormats;
  const cfg={verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
  if(F)cfg.formatsToSupport=[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.QR_CODE];
  const gate2=makeGate(m=>{$('scInfo').textContent=m});
  $('scInfo').textContent='請把條碼放大到填滿框的一半以上寬度，保持穩定、避免反光';
  sc2=new Html5Qrcode('scReader',cfg);
  try{
    await startCam(sc2,t=>{
      if(!gate2(t))return;
      t=t.trim();
      scRecord(t);navigator.vibrate&&navigator.vibrate(60);toast('已記錄：'+t,1200);
    });
  }catch(e){
    const n=(e&&e.name)||'',msg=String((e&&e.message)||e||'');
    const blocked=n==='NotAllowedError'||/permission|denied|not allowed/i.test(msg);
    toast((blocked?'相機被封鎖了：請允許相機權限':'無法開啟即時相機：'+(n||msg))+'\n請改按「照片」',6000);
    stopScan2();
  }
}
async function stopScan2(){
  try{if(sc2){await sc2.stop();sc2.clear()}}catch(e){}
  sc2=null;$('scReader').hidden=true;$('scInfo').textContent='';$('scScan').textContent='掃描';
}
$('scScan').onclick=()=>sc2?stopScan2():startScan2();
$('scPic').onclick=()=>$('scFile').click();
$('scFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!window.Html5Qrcode)return;
  try{
    const h=new Html5Qrcode('scTmp');
    const t=await h.scanFile(f,false);
    const c=String(t).trim();
    if(okPrefix(c)){scRecord(c);toast('已記錄：'+c,1500)}else toast('讀到的是 '+c+'，開頭不符，已略過'+prefixTip(),3500);
  }catch(err){toast('讀不到條碼，請拍近一點、對焦後再試')}
};

function tab(n){
  $('p1').hidden=n!==1;$('p2').hidden=n!==2;$('p3').hidden=n!==3;
  $('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);$('t3').classList.toggle('on',n===3);
  if(n!==1)stopScan();
  if(n!==3)stopScan2();
  if(n===3&&!('ontouchstart' in window))$('scCode').focus();
}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);$('t3').onclick=()=>tab(3);

async function load(){
  try{
    const d=await run('getData');
    logs=d.logs;fillPurposes(d.purposes||[]);
    if(d.url)$('sheet').href=d.url;
    $('dbwarn').hidden=true;renderList();updateLocHint();setAllLoc();
  }catch(e){$('dbwarn').hidden=false}
}
addRow('',false);
setAct('借出');
load();
setInterval(()=>{if(!document.hidden)load()},20000);
</script>
